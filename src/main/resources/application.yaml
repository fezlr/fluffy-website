spring:
  application:
    name: fluffy
    base-url: http://localhost:8080
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop #change to VALIDATE if in production
  docker:
    compose:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  token:
    expired-time-minutes: ${TOKEN_EXPIRED_TIME_MINUTES}
  mail:
    name: "Fluffy"
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    code:
      subject: "Confirm your email"
      message: |
        Thank you for registration. 
        Your code:
        %s
    link:
      subject: "Reset your password"
      message: |
        Reset your password:
        %s/api/v1/auth/reset-password?token=%s
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  auth:
    create:
      message: "A confirmation code has been sent to your email address. Please note that this code will expire in 15 minutes"
    reset-password:
      message: "A confirmation link has been sent to your email address. Please note that this code will expire in 15 minutes"