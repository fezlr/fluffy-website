<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content}, ~{::extraHead}, ~{::extraScript})}">

<th:block th:fragment="extraHead">
    <link th:href="@{/css/home.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="content">
    <div class="feed">

        <div class="post-compose">
            <textarea class="compose-input" placeholder="What's on your mind?"></textarea>
            <div class="compose-footer">
                <button class="btn-post">Post</button>
            </div>
        </div>

        <div th:each="post : ${posts}" class="post-card">
            <div class="post-header">
                <img class="post-avatar"
                     th:src="${post.avatarUrl != null} ? ${post.avatarUrl} : '/images/default-avatar.png'"
                     alt="">
                <div class="post-meta">
                    <span class="post-author" th:text="${post.firstName + ' ' + post.lastName}"></span>
                    <span class="post-date" th:text="${post.createdAt}"></span>
                </div>
            </div>
            <p class="post-text" th:text="${post.content}"></p>
        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty-feed">
            <p>No posts yet. Follow someone to see their posts here.</p>
        </div>

    </div>
</th:block>

<th:block th:fragment="extraScript">
<!--    <script th:src="@{/js/home.js}"></script>-->
</th:block>

</html>
