<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content}, ~{::extraHead}, ~{::extraScript})}">

<th:block th:fragment="extraHead">
    <meta name="_csrf"        th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link th:href="@{/css/home.css}" rel="stylesheet">
</th:block>



<th:block th:fragment="content">

    <div id="edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2>Edit Post</h2>

            <div id="edit-current-photo-wrap" style="display: none;">
                <img id="edit-current-photo" class="edit-preview-img" src="" alt="">
                <label class="edit-remove-photo-label">
                    <input type="checkbox" id="edit-remove-photo"> Remove photo
                </label>
            </div>

            <label class="modal-upload-label">
                <input type="file" id="edit-photo" accept="image/*">
                <svg class="modal-upload-icon" xmlns="http://www.w3.org/2000/svg"
                     width="28" height="28" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span id="edit-photo-name" class="photo-name">Replace photo (optional)</span>
            </label>

            <textarea id="edit-text" placeholder="What's on your mind? (optional)"></textarea>

            <p id="edit-modal-error" class="modal-error" style="display: none;">
                Please add at least a photo or some text.
            </p>

            <div class="modal-actions">
                <button id="btn-edit-cancel" class="btn-cancel">Cancel</button>
                <button id="btn-edit-submit" class="btn-submit">Save</button>
            </div>
        </div>
    </div>


    <div id="delete-modal" class="modal-overlay" style="display: none;">
        <div class="modal modal--compact">
            <h2>Delete post?</h2>
            <p class="delete-modal-text">This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="btn-delete-cancel" class="btn-cancel">Cancel</button>
                <button id="btn-delete-confirm" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>



    <div class="feed" id="feed-container"
         th:data-seed="${feed}"
         th:data-size="${feedSize}"
         th:data-user-id="${user.id}">

        <div class="feed-topbar">
            <h1>Posts</h1>
            <button id="btn-add-post" class="btn-add-post">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                New Post
            </button>
        </div>

        <div id="post-modal" class="modal-overlay" style="display: none;">
            <div class="modal">
                <h2>New Post</h2>

                <label class="modal-upload-label">
                    <input type="file" id="post-photo" accept="image/*">
                    <svg class="modal-upload-icon" xmlns="http://www.w3.org/2000/svg"
                         width="28" height="28" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span id="photo-name" class="photo-name">Add a photo (optional)</span>
                </label>

                <textarea id="post-text" placeholder="What's on your mind? (optional)"></textarea>

                <p id="modal-error" class="modal-error" style="display: none;">
                    Please add at least a photo or some text.
                </p>

                <div class="modal-actions">
                    <button id="btn-cancel" class="btn-cancel">Cancel</button>
                    <button id="btn-submit" class="btn-submit">Post</button>
                </div>
            </div>
        </div>

        <div id="posts-list"></div>

        <div id="empty-feed" class="empty-feed" style="display: none;">
            <p>Nothing here yet — be the first to post.</p>
        </div>

        <div id="spinner" class="spinner-wrapper" style="display: none;">
            <div class="spinner-circle"></div>
        </div>

        <div id="sentinel"></div>
    </div>
</th:block>

<th:block th:fragment="extraScript">
    <script th:src="@{/js/home.js}"></script>
</th:block>

</html>
