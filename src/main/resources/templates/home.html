<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluffy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row vh-100">

        <div class="col-2 bg-white border-end d-flex flex-column p-2" style="max-width: 180px;">

            <h5 class="fw-bold mb-3">Fluffy</h5>

            <div class="d-flex flex-column gap-2">
                <a href="/home" class="btn btn-light text-start btn-sm">Main (Home)</a>
                <a href="/profile" class="btn btn-light text-start btn-sm">Profile</a>
                <a href="/friends" class="btn btn-light text-start btn-sm">Friends</a>
                <a href="/messages" class="btn btn-light text-start btn-sm">Messages</a>
                <a href="/settings" class="btn btn-light text-start btn-sm">Settings</a>
            </div>

            <form method="post" th:action="@{/logout}">
                <div class="mt-auto">
                    <button type="submit" class="btn btn-outline-danger w-100 mt-3 btn-sm">Logout</button>
                </div>
            </form>
        </div>

        <div class="col d-flex justify-content-center">
            <div class="w-100" style="max-width: 600px; margin-top: 30px;">
                <div class="card p-3 mb-3">
                    <textarea class="form-control mb-2" rows="2" placeholder="What's on your mind?"></textarea>
                    <button class="btn btn-primary btn-sm align-self-end">Post</button>
                </div>

                <div class="card p-3 mb-3">
                    <div class="d-flex gap-2 align-items-center mb-2">
                        <div>
                            <div class="fw-semibold">John Doe</div>
                            <small class="text-muted">2 hours ago</small>
                        </div>
                    </div>
                    <p class="mb-0">Hello world!</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
