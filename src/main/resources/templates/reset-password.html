<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset password</title>
    <link th:href="@{/css/reset-password.css}" rel="stylesheet">
</head>

<script th:src="@{/js/reset-password.js}" defer></script>

<body>

<div class="reset-password-container">
    <div class="reset-password-card">

        <div id="error-box" style="display:none" class="error-box">
            <span id="error-message"></span>
        </div>

        <div th:if="${param.error}" class="error-box">
         </div>

        <h2>Reset password</h2>

        <form onsubmit="resetPassword(); return false;">
            <input id="password" type="password" placeholder="Password" required>
            <input id="confirmPassword" type="password" placeholder="Confirm password" required>

            <button type="submit">Reset password</button>
        </form>

    </div>
</div>
<input type="hidden" id="csrfToken" th:value="${_csrf?.token}">
</body>
</html>
