<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content}, ~{::extraHead}, ~{::extraScript})}">

<th:block th:fragment="extraHead">
    <link rel="stylesheet" th:href="@{/css/messages.css}">
</th:block>

<th:block th:fragment="content">

    <div class="messages-page">

        <aside class="messages-sidebar">

            <div class="messages-sidebar-header">
                <h2>Messages</h2>
            </div>

            <div class="search-box">
                <input type="text"
                       id="chatSearch"
                       placeholder="Search chats...">
            </div>

            <div class="chat-list" id="chatList">

                <div class="chat-card"
                     th:each="chat : ${chats}"
                     th:data-chat-id="${chat.id}"
                     th:data-chat-name="${chat.name}"
                     onclick="selectChat(this)">

                    <img class="chat-avatar"
                         th:src="@{/images/default-avatar.png}"
                         alt="avatar">

                    <div class="chat-content">

                        <div class="chat-top">

                        <span class="chat-name"
                              th:text="${chat.name}">
                        </span>

                            <span class="chat-date"
                                  th:text="${#temporals.format(chat.createdAt, 'HH:mm')}">
                        </span>

                        </div>

                        <div class="chat-preview">
                            Open conversation
                        </div>

                    </div>

                </div>

            </div>

        </aside>

        <section class="chat-section">

            <div class="empty-chat" id="emptyChat">
                <h3>Select a chat</h3>
                <p>Start messaging with your friends.</p>
            </div>

            <div class="chat-container hidden" id="chatContainer">

                <div class="chat-header">

                    <div class="chat-user">

                        <img th:src="@{/images/default-avatar.png}" alt="avatar">

                        <div>
                            <h3 id="selectedChatName">Chat</h3>
                            <span>Online</span>
                        </div>

                    </div>

                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="message-input-container">

                    <input type="text"
                           id="messageInput"
                           placeholder="Write a message...">

                    <button class="send-btn" onclick="sendMessage()">
                        Send
                    </button>

                </div>

            </div>

        </section>

    </div>

    <input type="hidden"
           id="current-user-id"
           th:value="${profile.user.id}">

</th:block>

<th:block th:fragment="extraScript">

    <script th:inline="javascript">
        const CURRENT_USER_ID = [[${profile.user.id}]];
    </script>

    <script th:src="@{/js/messages.js}"></script>

</th:block>

</html>
