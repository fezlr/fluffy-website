<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(
          ~{::content},
          ~{::extraHead},
          ~{::extraScript}
      )}">

<th:block th:fragment="extraHead">
    <link th:href="@{/css/profile.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="content">

    <div class="profile-page">

        <div class="profile-cover">
            <div class="cover-img"></div>
            <div class="profile-avatar-wrap">
                <img class="profile-avatar"
                     th:src="${profile.mainPhotoUrl != null ? profile.mainPhotoUrl : '/images/default-avatar.png'}"
                     alt="avatar">
            </div>
        </div>

        <div class="profile-info">
            <div class="profile-name-row">
                <div>
                    <h1 class="profile-name"
                        th:text="${profile.firstName + ' ' + profile.lastName}"></h1>
                    <span class="profile-username"
                          th:text="'@' + ${user.username}"></span>
                </div>

                <div class="profile-actions">
                    <button th:if="${isOwnProfile}"
                            class="btn-edit"
                            onclick="window.location.href='/profile/settings'">
                        Edit profile
                    </button>

                    <button th:unless="${isOwnProfile}"
                            class="btn-follow"
                            id="follow-btn"
                            th:data-id="${user.id}">
                        Follow
                    </button>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    <span class="stat-value" th:text="${postsCount}">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat">
                    <span class="stat-value" th:text="${followersCount}">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat">
                    <span class="stat-value" th:text="${followingCount}">0</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>
        </div>

        <div class="profile-tabs">
            <button class="tab active" data-tab="posts">Posts</button>
            <button class="tab" data-tab="photos">Photos</button>
        </div>

        <div class="tab-content active" id="tab-posts">
            <div class="posts-grid">

                <div th:each="post : ${posts}" class="post-card">
                    <div class="post-header">
                        <img class="post-avatar"
                             th:src="${profile.mainPhotoUrl != null ? profile.mainPhotoUrl : '/images/default-avatar.png'}"
                             alt="">
                        <div>
                            <div class="post-author"
                                 th:text="${profile.firstName + ' ' + profile.lastName}"></div>
                            <div class="post-date"
                                 th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                        </div>
                    </div>
                    <p class="post-text" th:text="${post.content}"></p>
                </div>

                <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
                    No posts yet
                </div>

            </div>
        </div>

        <div class="tab-content" id="tab-photos">
            <div class="empty-state">No photos yet</div>
        </div>

    </div>

</th:block>

<th:block th:fragment="extraScript">
    <script th:src="@{/js/profile.js}"></script>
</th:block>

</html>
