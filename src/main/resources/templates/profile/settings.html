<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content}, ~{::extraHead}, ~{::extraScript})}">

<th:block th:fragment="extraHead">
    <link th:href="@{/css/settings.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="content">
    <div class="settings-page">

        <div class="settings-sidebar">
            <div class="settings-nav">
                <button class="settings-item active" data-section="account">Account</button>
                <button class="settings-item" data-section="privacy">Privacy</button>
                <button class="settings-item" data-section="notifications">Notifications</button>
                <button class="settings-item" data-section="password">Password</button>
            </div>
        </div>

        <div class="settings-content">

            <div class="settings-section active" id="section-account">
                <h3>Account</h3>
                <div class="settings-form">
                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" placeholder="Ivan">
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" placeholder="Petrov">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" placeholder="@username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="email@example.com">
                    </div>
                    <button class="btn-save">Save changes</button>
                </div>
            </div>

            <div class="settings-section" id="section-privacy">
                <h3>Privacy</h3>
                <div class="settings-form">
                    <div class="toggle-group">
                        <div>
                            <div class="toggle-label">Private account</div>
                            <div class="toggle-desc">Only approved followers can see your posts</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-group">
                        <div>
                            <div class="toggle-label">Show online status</div>
                            <div class="toggle-desc">Let others see when you're active</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="settings-section" id="section-notifications">
                <h3>Notifications</h3>
                <div class="settings-form">
                    <div class="toggle-group">
                        <div>
                            <div class="toggle-label">New messages</div>
                            <div class="toggle-desc">Get notified when you receive a message</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="toggle-group">
                        <div>
                            <div class="toggle-label">Friend requests</div>
                            <div class="toggle-desc">Get notified about new friend requests</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="settings-section" id="section-password">
                <h3>Change password</h3>
                <div class="settings-form">
                    <div class="form-group">
                        <label>Current password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>New password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Confirm new password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <button class="btn-save">Update password</button>
                </div>
            </div>

        </div>
    </div>
</th:block>

<th:block th:fragment="extraScript">
    <script th:src="@{/js/settings.js}"></script>
</th:block>

</html>
